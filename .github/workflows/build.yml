name: build

on:
  workflow_dispatch: {}
  push:
    branches:
      - jbion/github-build

permissions:
  contents: read

jobs:
  test-standard:
    strategy:
      fail-fast: false # So that all jobs run to completion even when one fails
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        testsType: [ cli-e2e, unit, wrapper ]
        include:
          - testsType: cli-e2e
            testActionName: Run CLI tests
            testCommandOptions: --include-module=amper-cli-test
          - testsType: wrapper
            testActionName: Run wrapper tests
            testCommandOptions: --include-module=amper-wrapper-test
          - testsType: unit
            testActionName: Run regular unit tests
            testCommandOptions: --exclude-module=amper-mobile-test --exclude-module=amper-cli-test --exclude-module=amper-wrapper-test
    name: Tests (${{ matrix.os }}, ${{ matrix.testsType }})
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Kotlin Toolchain caches
        uses: ./.github/actions/setup-kotlin-toolchain

      - name: Setup test caches
        uses: ./.github/actions/test-caches

      # Required for CinteropTest.`lib + app - run linuxX64()`
      - name: Install libcurl for cinterop tests (Linux-only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: ${{ matrix.testActionName }}
        run: ./kotlin test ${{ matrix.testCommandOptions }}

      - name: Report Amper logs
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }} # run this step even if the previous step failed
        with:
          name: build-logs-${{ runner.os }}
          path: build/logs/**
          archive: true

      # In amper-cli-test, we start child Amper CLI processes we publish their logs as attachments of JUnit reports
      - name: Report JUnit attachments
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }} # run this step even if the previous step failed
        with:
          name: junit-attachments-${{ runner.os }}
          path: build/reports/*/jvm/junit-jupiter
          archive: true
          retention-days: 15

      - name: Report test results
        uses: ./.github/actions/report-tests
        if: ${{ !cancelled() }} # run this step even if the previous step failed

  test-mobile:
    strategy:
      fail-fast: false # So that all jobs run to completion even when one fails
      matrix:
        include:
          - description: Android examples
            testArgs: "\"--include-tag=android-emulator & !external-test-project\""
            os: ubuntu-latest
          - description: iOS examples
            testArgs: "\"--include-tag=ios-simulator & !external-test-project\""
            os: macos-latest
          - description: Android external projects
            testArgs: "\"--include-tag=android-emulator & external-test-project\""
            os: ubuntu-latest
          - description: iOS external projects
            testArgs: "\"--include-tag=ios-simulator & external-test-project\""
            os: macos-latest
    name: Mobile tests (${{ matrix.description }})
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Kotlin Toolchain caches
        uses: ./.github/actions/setup-kotlin-toolchain

      - name: Setup test caches
        uses: ./.github/actions/test-caches

      - name: Enable KVM group perms
        if: ${{ runner.os == 'Linux' }} # needed for Android emulator
        # See https://github.blog/changelog/2023-02-23-hardware-accelerated-android-virtualization-on-actions-windows-and-linux-larger-hosted-runners/
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run mobile tests
        # we need --include-classes=* for now, because the test classes don't follow the *Test|Test* pattern
        run: ./kotlin test -m amper-mobile-test --include-classes=* ${{ matrix.testArgs }}

      - name: Report Amper logs
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }} # run this step even if the previous step failed
        with:
          name: build-logs-mobile-${{ matrix.description }}
          path: build/logs/**
          archive: true

      - name: Report test results
        uses: ./.github/actions/report-tests
        if: ${{ !cancelled() }} # run this step even if previous step failed
