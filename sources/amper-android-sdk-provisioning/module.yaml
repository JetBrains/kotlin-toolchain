product: jvm/lib

description: Android SDK tools provisioning support.

apply:
  - //sources/common.module-template.yaml
  - //sources/used-in-idea.module-template.yaml

dependencies:
  - //sources/amper-problem-reporting: exported
  - //sources/core
  - //sources/libraries/concurrency
  - //sources/libraries/incremental-cache: exported
  - //sources/libraries/telemetry
  - $libs.android.tools.sdklib
  - $libs.maven.artifact
  - jakarta.xml.bind:jakarta.xml.bind-api:2.3.2

test-dependencies:
  - //sources/test-base
  - //sources/libraries/system-info
  - $libs.opentelemetry.sdkTesting
