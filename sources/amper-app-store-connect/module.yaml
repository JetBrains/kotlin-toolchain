product: jvm/lib

description: App Store Connect API access.

apply:
  - //sources/common.module-template.yaml

dependencies:
  - //sources/core
  - $kotlin.serialization.json
  - $libs.bouncycastle.bcpkix
  - $libs.bouncycastle.bcprov
