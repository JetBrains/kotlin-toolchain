product: jvm/lib

description: Tests that verify the Amper bootstrap mechanism in the Amper wrapper scripts.

apply:
  - ../../dr.amper.common.module-template.yaml

test-dependencies:
  - ../../amper-jdk-provisioning
  - ../../amper-wrapper
  - ../../core
  - ../../libraries/system-info
  - ../../test-base

tasks:
  testJvm:
    # fully built zip cli dist is required for wrapper tests and it's published to maven local
    dependsOn: [ :amper-cli:uploadLocal@amper-distribution ]
