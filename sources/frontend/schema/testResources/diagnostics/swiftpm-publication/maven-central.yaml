    enabled: true
    group: com.example
    version: 1.0.0
    mavenCentral: enabled
    publishSources: true
    signArtifacts: true
    pom:
      url: https://example.org
      scm: https://git.example.org
      licenses:
        - name: MIT
          url: https://opensource.org/licenses/MIT
      developers:
        - John Doe