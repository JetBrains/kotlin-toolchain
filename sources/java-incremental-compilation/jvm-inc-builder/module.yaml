product: jvm/lib

description: Java incremental compilation implementation, mostly copy-pasted from IntelliJ sources.

apply:
  - //sources/common.module-template.yaml
  - //sources/used-in-jic.module-template.yaml

repositories:
  - id: ijSnapshots
    url: https://www.jetbrains.com/intellij-repository/snapshots

dependencies:
  - //sources/java-incremental-compilation/intellij-build-zip

  - $libs.kotlinx.coroutines.core
  - $libs.opentelemetry.api
  - $libs.slf4j.api

  #  JPS
  - $libs.intellij.jps.build.dependency.graph
  - $libs.intellij.jps.build.javac.rt
  - org.jetbrains.jps:jps-javac-extension:10

  # Helper libraries.
  # Change only when updating IntelliJ Platform dependency: these should be in sync with the library versions in the monorepo
  - com.h2database:h2-mvstore:2.3.232  # in monorepo it comes as a transitive dependency, check the version e.g. in the 'util-ex' module
  - org.jetbrains.kotlin:kotlin-metadata-jvm:2.3.20-RC2
  - com.github.ben-manes.caffeine:caffeine:3.2.3
  - jaxen:jaxen:1.2.0
  - com.thoughtworks.qdox:qdox:2.2.0
  - $libs.intellij.deps.fastutil
