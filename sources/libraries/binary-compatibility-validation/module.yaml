product: jvm/lib

description: |
  Binary compatibility validation library.
  
  The code should ideally be kept in sync with the
  [binary-compatibility-validator](https://github.com/Kotlin/binary-compatibility-validator/tree/master/src/main/kotlin/api)
  plugin sources.

apply:
  - //sources/common.module-template.yaml

dependencies:
  - $libs.asm
  - $libs.asm.tree
  - $libs.kotlin.metadata
