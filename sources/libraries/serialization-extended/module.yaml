product: jvm/lib

description: Additional serializers for kotlinx.serialization.

apply:
  - //sources/common.module-template.yaml
  - //sources/used-in-gradle.module-template.yaml
  - //sources/used-in-idea.module-template.yaml
  - //sources/used-in-jic.module-template.yaml
  - //sources/used-in-kotlin-notebook.module-template.yaml

settings:
  kotlin:
    # Just for the core library. This is not ideal, but we don't have a way to get a kotlinx-serialization-core
    # catalog entry that respects the serialization version from the settings.
    serialization: enabled
  jvm:
    release: 11
