product: jvm/lib

description: Integration tests for the fully-packaged Amper CLI.

apply:
  - //sources/common.module-template.yaml

test-dependencies:
  - //sources/amper-build-info
  - //sources/amper-kotlin-native
  - //sources/amper-wrapper
  - //sources/core
  - //sources/frontend-api # for DefaultVersions
  - //sources/frontend/schema
  - //sources/libraries/gradle-module-metadata
  - //sources/libraries/system-info
  - //sources/libraries/telemetry
  - //sources/test-base
  - $libs.bouncycastle.bcpg # for test key generation
  - $libs.junit.jupiter.params
  - $libs.kotlinx.coroutines.test
  - $libs.maven.artifact # just for ComparableVersion
  - $libs.teamcity.serviceMessages # to parse service messages in tests
  - $libs.compose.hot.reload.orchestration
  - $libs.compose.hot.reload.core
  - com.android.tools.apkparser:apkanalyzer:31.2.0
  - com.android.tools.apkparser:binary-resources:31.2.0
  - org.smali:dexlib2:2.5.2 # todo: use apkanalyzer API to get rid of this dependency

settings:
  jvm:
    test:
      systemProperties:
        junit.jupiter.execution.parallel.config.strategy: fixed
        junit.jupiter.execution.parallel.config.fixed.parallelism: 4
        # 2 reasons for running most tests concurrently:
        #   1. it increases the likelihood of detecting concurrency issues between Amper CLI processes
        #   2. it can speed up the overall test suite execution time, especially locally
        junit.jupiter.execution.parallel.mode.default: concurrent

test-settings:
  kotlin:
    optIns: [ org.jetbrains.amper.frontend.schema.DiscouragedDirectDefaultVersionAccess ]

tasks:
  testJvm:
    # To build&publish the amper-android-gradle-plugin and deps for gradle-backed Android builds
    # To build&publish the CLI distribution and scripts required for wrapper-based tests
    # To build&publish the amper-extensibility-api.jar for the plugin tests
    dependsOn:
      - :amper-android-gradle-plugin:publishJvmToMavenLocal
      - :amper-cli:uploadLocal@amper-distribution
      - :amper-extensibility-api:publishJvmToMavenLocal
