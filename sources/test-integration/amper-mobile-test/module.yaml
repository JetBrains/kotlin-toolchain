product: jvm/lib

description: Amper CLI tests in mobile scenarios.

test-dependencies:
  - //sources/libraries/apple-simulator-manager
  - //sources/libraries/serialization-extended
  - //sources/test-base
  - $libs.kotlinx.coroutines.test
  - $libs.maven.artifact

apply:
  - //sources/common.module-template.yaml

tasks:
  testJvm:
    # To build&publish the CLI distribution and scripts required for wrapper-based tests
    dependsOn: [ :amper-cli:uploadLocal@amper-distribution ]

settings:
  kotlin:
    serialization: json
