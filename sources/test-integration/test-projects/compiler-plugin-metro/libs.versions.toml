[versions]

ktor = "3.5.2"
# Metro 1.4.1 fails with "generateContributionHintsInFir cannot be disabled when generateContributionHints is enabled on Kotlin 2.3.21"
metro = "1.4.0"
okhttp = "5.4.0"
okio = "3.18.1"

[libraries]

clikt = "com.github.ajalt.clikt:clikt:5.1.0"
kotlinx-datetime = "org.jetbrains.kotlinx:kotlinx-datetime:0.7.1"
ktor-client = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-auth = { module = "io.ktor:ktor-client-auth", version.ref = "ktor" }
ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-engine-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
metro-compilerPlugin = { module = "dev.zacsweers.metro:compiler", version.ref = "metro" }
metro-runtime = { module = "dev.zacsweers.metro:runtime", version.ref = "metro" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
picnic = "com.jakewharton.picnic:picnic:0.7.0"
slf4jNop = "org.slf4j:slf4j-nop:2.0.18"
