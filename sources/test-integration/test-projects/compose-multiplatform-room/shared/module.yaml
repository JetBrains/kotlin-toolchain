product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64 ]

dependencies:
  - $compose.foundation: exported
  - $compose.material3: exported
  - $libs.androidx.room3.runtime: exported # exported because of the RoomDatabase type that we output
  - $libs.androidx.sqlite.bundled

settings:
  kotlin:
    freeCompilerArgs:
      - -Xexpect-actual-classes
    ksp:
      processors:
        - $libs.androidx.room3.compiler
  compose: enabled

# we want separate schema locations for each platform, otherwise there might be concurrency issues
settings@jvm:
  kotlin:
    ksp:
      processorOptions:
        room.schemaLocation: ./generated-db-schema/jvm
settings@android:
  kotlin:
    ksp:
      processorOptions:
        room.schemaLocation: ./generated-db-schema/android
settings@ios:
  kotlin:
    ksp:
      processorOptions:
        room.schemaLocation: ./generated-db-schema/ios
