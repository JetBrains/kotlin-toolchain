product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64 ]

aliases:
  - nonAndroid: [ jvm, iosArm64, iosSimulatorArm64 ]
  # This alias crosses the natural hierarchy on purpose: it makes the refinement graph of the iosArm64 compilation
  # a diamond rather than a chain, which is where merging Compose resources by distance to the leaf fragment breaks.
  - androidAndIosArm64: [ android, iosArm64 ]

settings:
  compose:
    enabled: true
    resources:
      packageName: com.example.gen
      exposedAccessors: true

dependencies:
  - $compose.material3
  # this is no longer updated, but we need it here for the demo's sake.
  - org.jetbrains.compose.material:material-icons-core:1.7.3

dependencies@jvm:
  - $compose.desktop.common

test-dependencies@jvm:
  - $compose.uiTest
