product: ios/app

repositories:
  - id: mavenLocal
    url: mavenLocal
    resolve: true

settings:
  compose:
    enabled: true
    resources:
      packageName: com.example.appios.gen
      exposedAccessors: true

dependencies:
  - $compose.foundation
  # a library published by Amper itself (see the 'compose-resources-publication' test project)
  - org.example:library-native:1.0.0
