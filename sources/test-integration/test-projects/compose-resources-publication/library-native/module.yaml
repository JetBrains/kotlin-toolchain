product:
  type: kmp/lib
  platforms: [ iosArm64, iosSimulatorArm64 ]

settings:
  compose:
    enabled: true
    resources:
      packageName: com.example.libnative.gen
      exposedAccessors: true
  publishing:
    enabled: true
    group: org.example
    artifactId: library-native
    version: 1.0.0

repositories:
  - id: mavenLocal
    url: mavenLocal
    publish: true
