product:
  type: kmp/lib
  platforms:
    - jvm
    - js
    - wasmJs
    - wasmWasi
    - android
    - iosArm64
    - linuxX64

apply:
  - ../common.module-template.yaml

dependencies:
  # A multiplatform dependency: each platform resolves it to its own variant, and each platform POM must declare
  # the variant of that very platform (see KTC-5650).
  - org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2: exported

settings:
  publishing:
    publishSources: true
