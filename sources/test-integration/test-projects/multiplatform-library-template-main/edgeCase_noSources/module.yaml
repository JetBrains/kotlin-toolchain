# A module without any sources: all sources and resources are optional, only module.yaml is required.
# Such modules are typically used to aggregate (and re-export) dependencies. See KTC-5652.
product:
  type: kmp/lib
  platforms: [jvm, linuxX64]

apply:
  - ../common.module-template.yaml

dependencies:
  - org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2: exported

settings:
  publishing:
    artifactId: noSources
