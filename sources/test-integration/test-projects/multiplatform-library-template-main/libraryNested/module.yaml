product:
  type: kmp/lib
  platforms: [linuxX64, linuxArm64, macosArm64, macosX64, jvm, android]

aliases:
  - macPlusLinux: [linuxX64, linuxArm64, macosArm64, macosX64]

apply:
  - ../common.module-template.yaml

dependencies:
  - $libs.kotlinx.coroutines.core
  - ../library
  - bom: com.fasterxml.jackson:jackson-bom:2.18.2

test-dependencies:
  - $kotlin.test

settings:
  publishing:
    artifactId: libraryNested