# A library that declares SwiftPM dependencies.
# The packages are local so that the publication can be tested without any network access.
# See original_gradle/README.md for the equivalent Gradle project, used to compare the publication with KGP's.
product:
  type: kmp/lib
  platforms: [ iosArm64, macosArm64 ]

dependencies:
  - localSwiftPackage:
      path: commonPackage
      products: [ "CommonProduct" ]

dependencies@ios:
  - localSwiftPackage:
      path: iosOnlyPackage
      products: [ "IosOnlyProduct" ]

repositories:
  - id: mavenLocal
    url: mavenLocal
    publish: true

settings:
  publishing:
    group: org.jetbrains.kotlintoolchain.swiftpm.sample
    artifactId: swiftPMPublication
    version: 1.0.0
    enabled: true
