# A library that declares SwiftPM dependencies.
# The packages are local so that the publication can be tested without any network access.
# See original_gradle/README.md for the equivalent Gradle project, used to compare the publication with KGP's.
product:
  type: kmp/lib
  platforms: [ iosArm64, macosArm64 ]

dependencies:
  - localSwiftPackage:
      path: commonPackage
      products: [ "CommonProduct" ]

dependencies@ios:
  - localSwiftPackage:
      path: iosOnlyPackage
      products: [ "IosOnlyProduct" ]

repositories:
  - id: mavenLocal
    url: mavenLocal
    publish: true
  # Only declared to check that a library with local Swift packages cannot be published to a shared repository.
  # It is never actually reached, so the URL doesn't have to exist.
  - id: remoteRepo
    url: https://example.com/maven
    publish: true
    resolve: false

settings:
  publishing:
    group: org.jetbrains.kotlintoolchain.swiftpm.sample
    artifactId: swiftPMPublication
    version: 1.0.0
    enabled: true
