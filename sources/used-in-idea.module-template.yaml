apply:
  - //sources/common.module-template.yaml

settings:
  kotlin:
    version: 2.4.0 # Should be aligned with the oldest version of IntelliJ platform for which we cherry-pick.
    serialization:
      version: 1.9.0 # Aligned with IntelliJ platform
  jvm:
    release: 21 # Modules used in IntelliJ should have release version aligned with the SDK
  publishing:
    enabled: true
