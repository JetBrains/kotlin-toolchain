apply:
  - //sources/common.module-template.yaml

settings:
  jvm:
    # JPS libraries require at least JDK 21, so we have diagnostics to force the user to use at least 21.
    # Therefore, there is no point is setting the release lower than 16 here, because we know it will run on 21+.
    # Also, because the user can go as low as 21, we can't use a higher release than 21 here, so we choose exactly 21.
    release: 21
